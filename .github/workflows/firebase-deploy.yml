name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy to Firebase Hosting
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools@13 deploy \
            --only hosting \
            --project mestreapp-4e3e1 \
            --non-interactive \
            --force

      # As regras vivem no repositorio (firebase.json aponta para elas), mas ate
      # aqui nunca eram publicadas: o deploy so cobria hosting.
      #
      # HOJE ISTO NAO PUBLICA NADA: a service account do secret deploya Hosting,
      # mas a API de Rules recusa com 403 "The caller does not have permission".
      # Para ligar, conceda o papel "Firebase Rules Admin"
      # (roles/firebaserules.admin) no IAM do projeto mestreapp-4e3e1 ao principal
      # cujo e-mail esta no client_email do secret FIREBASE_SERVICE_ACCOUNT.
      #
      # Enquanto isso o passo nao derruba o build, mas emite um aviso visivel no
      # resumo da execucao — o build verde nunca deve dar a entender que as
      # regras subiram quando elas nao subiram.
      - name: Deploy Firestore rules
        run: |
          set -uo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          if npx -y firebase-tools@13 deploy --only firestore:rules --project mestreapp-4e3e1 --non-interactive --force; then
            echo "Regras do Firestore publicadas."
          else
            echo "::warning title=Regras do Firestore NAO publicadas::firestore.rules continua desatualizado no projeto. Falta o papel Firebase Rules Admin na service account (403 em firebaserules.googleapis.com). Veja o comentario no workflow."
          fi
