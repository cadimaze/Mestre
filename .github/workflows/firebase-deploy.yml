name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy to Firebase Hosting
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools@13 deploy \
            --only hosting \
            --project mestreapp-4e3e1 \
            --non-interactive \
            --force

      # As regras vivem no repositorio (firebase.json aponta para elas), mas ate
      # aqui nunca eram publicadas: o deploy so cobria hosting. Roda depois do
      # hosting para que uma falha aqui nao derrube o site.
      #
      # So firestore: o app nao usa Firebase Storage (as imagens vao para o
      # Cloudinary), o bucket nunca foi provisionado e "--only storage" falha.
      - name: Deploy Firestore rules
        # BLOQUEADO NO IAM, nao no codigo. A service account do secret
        # FIREBASE_SERVICE_ACCOUNT deploya Hosting, mas a API de Rules recusa:
        #   firebaserules.googleapis.com ... HTTP Error: 403,
        #   The caller does not have permission
        # Para ligar: no Google Cloud IAM do projeto mestreapp-4e3e1, conceda
        # o papel "Firebase Rules Admin" (roles/firebaserules.admin) ao principal
        # cujo e-mail esta no campo client_email do secret. Feito isso, este
        # passo passa a publicar firestore.rules sozinho e o continue-on-error
        # abaixo pode ser removido.
        continue-on-error: true
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools@13 deploy \
            --only firestore:rules \
            --project mestreapp-4e3e1 \
            --non-interactive \
            --force
